name: Convert OmniEdu-4B + Pro-4B to RKLLM w4a16

on:
  workflow_dispatch:

jobs:
  convert:
    strategy:
      fail-fast: false
      matrix:
        include:
          - model_id: lhpku20010120/Omni-Edu-4B
            model_dir: Omni-Edu-4B
            out: OmniEdu-4B_w4a16.rkllm
          - model_id: lhpku20010120/Omni-Edu-Pro-4B
            model_dir: Omni-Edu-Pro-4B
            out: OmniEduPro-4B_w4a16.rkllm
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download toolkit & requirements
        run: |
          curl -L -o rkllm_toolkit-1.3.1-cp312-cp312-linux_x86_64.whl \
            "https://raw.githubusercontent.com/airockchip/rknn-llm/release-v1.3.1/rkllm-toolkit/packages/rkllm_toolkit-1.3.1-cp312-cp312-linux_x86_64.whl"
          curl -L -o requirements.txt \
            "https://raw.githubusercontent.com/airockchip/rknn-llm/release-v1.3.1/rkllm-toolkit/packages/requirements.txt"

      - name: Install CPU torch then deps
        run: |
          pip install --no-cache-dir torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir ./rkllm_toolkit-1.3.1-cp312-cp312-linux_x86_64.whl
          pip install --no-cache-dir -r requirements.txt

      - name: Verify toolkit
        run: python -c "from rkllm.api import RKLLM; print('RKLLM toolkit OK')"

      - name: Download model
        run: |
          pip install -U huggingface_hub
          python -c "from huggingface_hub import snapshot_download; snapshot_download('${{ matrix.model_id }}', local_dir='${{ matrix.model_dir }}')"

      - name: Convert to w4a16
        run: |
          export MODEL_DIR=${{ matrix.model_dir }}
          export OUT=${{ matrix.out }}
          python convert.py 2>&1 | tee convert.log
          ls -la ${{ matrix.out }}

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          retention-days: 7
          if-no-files-found: error